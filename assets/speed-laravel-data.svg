<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 232" width="700" height="232" role="img" aria-label="Wall time for the same 1,338 tests of spatie/laravel-data's Pest 4 suite, median of three alternated runs: Crucible 1.1.0, 61.08 seconds; Crucible 1.0.1, 328.52 seconds. 1.1.0 is 5.4 times faster. Every run passed the same 1,326 tests on both versions.">
  <!-- Measured 2026-09-26; method, commands and raw times in benchmarks/manifest.json (laravel-data.speed).
       One series, so one hue: both bars ember, the versions named in text. Bars start at zero. -->
  <style>
    :root { color-scheme: light dark; }
    .screen { fill: #fbfbfa; stroke: #d8d6d1; }
    .grid { stroke: #d8d6d1; stroke-width: 1; }
    .bar { fill: #e80c08; }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #24292f; }
    .title { font-size: 16px; font-weight: 600; }
    .muted { fill: #57606a; font-size: 12px; }
    .tick { fill: #57606a; font-size: 11px; font-variant-numeric: tabular-nums; }
    .name { font-size: 13px; font-weight: 600; }
    .value { font-size: 13px; font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      .screen { fill: #0d1117; stroke: #30363d; }
      .grid { stroke: #30363d; }
      text { fill: #c9d1d9; }
      .muted, .tick { fill: #8b949e; }
    }
  </style>
  <rect class="screen" x="0.5" y="0.5" width="699" height="231" rx="6"/>

  <text class="title" x="24" y="38">Same 1,338 tests, 1.0.1 against 1.1.0 — lower is faster</text>
  <text class="muted" x="24" y="60">spatie/laravel-data 4.23.0 · wall time, median of 3 alternated runs · same machine, same vendor/</text>

  <!-- x = 140 + seconds × 1.2 -->
  <line class="grid" x1="140.5" y1="80" x2="140.5" y2="176"/>
  <line class="grid" x1="260.5" y1="80" x2="260.5" y2="176"/>
  <line class="grid" x1="380.5" y1="80" x2="380.5" y2="176"/>
  <line class="grid" x1="500.5" y1="80" x2="500.5" y2="176"/>

  <text class="name" x="24" y="109">Crucible 1.1.0</text>
  <path class="bar" d="M140 92 H209.3 A4 4 0 0 1 213.3 96 V112 A4 4 0 0 1 209.3 116 H140 Z"><title>Crucible 1.1.0 — median 61.08 s (runs 61.08, 52.61, 66.47 s)</title></path>
  <text class="value" x="221" y="109">61.08 s</text>

  <text class="name" x="24" y="149">Crucible 1.0.1</text>
  <path class="bar" d="M140 132 H530.22 A4 4 0 0 1 534.22 136 V152 A4 4 0 0 1 530.22 156 H140 Z"><title>Crucible 1.0.1 — median 328.52 s (runs 299.48, 328.52, 344.19 s)</title></path>
  <text class="value" x="542" y="149">328.52 s</text>

  <text class="tick" x="140.5" y="192" text-anchor="middle">0 s</text>
  <text class="tick" x="260.5" y="192" text-anchor="middle">100 s</text>
  <text class="tick" x="380.5" y="192" text-anchor="middle">200 s</text>
  <text class="tick" x="500.5" y="192" text-anchor="middle">300 s</text>

  <text class="muted" x="24" y="218">1.1.0 5.4× faster · runs 52.6–66.5 s vs 299.5–344.2 s · every run 1,338 tests, 1,326 passed, 0 failed</text>
</svg>
